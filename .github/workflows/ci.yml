name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si se sube otra versión de la misma rama, la comprobación anterior se cancela.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `astro build` no revisa los tipos: `astro check` sí (errores de TypeScript y de las plantillas .astro).
      - name: Tipos y plantillas
        run: npm run check
      - name: Compilación
        run: npm run build
